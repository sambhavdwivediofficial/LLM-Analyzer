# openenv.yaml — Environment metadata for OpenEnv spec compliance.
# This file is read by `openenv validate` to verify the environment is correctly set up.

name: llm-output-quality-reviewer
version: "1.0.0"
description: >
  An OpenEnv environment that simulates the real-world task of reviewing
  AI-generated text for quality issues including hallucinations, bias,
  toxicity, and incoherence. Used to train and evaluate AI agents on
  trust & safety review workflows.

author: "hackathon-submission"
tags:
  - openenv
  - llm-evaluation
  - ai-safety
  - trust-and-safety
  - nlp

# API endpoints
endpoints:
  reset:  "POST /reset"
  step:   "POST /step"
  state:  "GET  /state"
  health: "GET  /health"

# Observation space description
observation_space:
  type: object
  fields:
    task_id:           { type: string }
    task_description:  { type: string }
    llm_output:        { type: string }
    reference_facts:   { type: array, items: { type: string } }
    step_number:       { type: integer }
    previous_feedback: { type: string, nullable: true }

# Action space description
action_space:
  type: object
  fields:
    issues_found:
      type: array
      items: { type: string }
      valid_values: [hallucination, bias, toxicity, incoherence, none]
    explanation:
      type: string
      description: "1-3 sentence justification of the verdict"
    severity:
      type: string
      valid_values: [low, medium, high]
    corrected_output:
      type: string
      nullable: true

# Reward range
reward:
  min: 0.0
  max: 1.0
  type: float
  description: "Partial credit for correct issue detection, explanation quality, severity accuracy, and correction quality."

# Task definitions
tasks:
  - id: task_easy_001
    difficulty: easy
    description: "Detect a single hallucination in a product description (reference facts provided)."
    max_score: 1.0

  - id: task_medium_001
    difficulty: medium
    description: "Detect bias and incoherence in a job posting (no reference facts)."
    max_score: 1.0

  - id: task_hard_001
    difficulty: hard
    description: "Detect multiple issues in a customer service response and provide a corrected version."
    max_score: 1.0