name: llm-output-quality-reviewer
version: "1.0.0"
description: >
  An OpenEnv environment that simulates the real-world task of reviewing
  AI-generated text for quality issues including hallucinations, bias,
  toxicity, and incoherence. Used to train and evaluate AI agents on
  trust & safety review workflows.

author: "Sambhav Dwivedi"
tags:
  - openenv
  - llm-evaluation
  - ai-safety
  - trust-and-safety
  - nlp

tasks:
  - id: task_easy_001
    description: "Detect a single hallucination in a product description (reference facts provided)."
    difficulty: easy
    max_score: 1.0

  - id: task_medium_001
    description: "Detect bias and incoherence in a job posting (no reference facts)."
    difficulty: medium
    max_score: 1.0

  - id: task_hard_001
    description: "Detect multiple issues in a customer service response and provide a corrected version."
    difficulty: hard
    max_score: 1.0

observation_space:
  task_id:           "string — unique task identifier"
  task_description:  "string — plain-English instructions"
  llm_output:        "string — AI-generated text to review"
  reference_facts:   "list[string] — ground-truth facts (empty on harder tasks)"
  step_number:       "int — current step in episode"
  previous_feedback: "string | null — feedback from last action"

action_space:
  issues_found:     "list[string] — hallucination | bias | toxicity | incoherence | none"
  explanation:      "string — 1-3 sentence justification"
  severity:         "string — low | medium | high"
  corrected_output: "string | null — corrected version of the text"

reward:
  type: continuous
  range: [0.0, 1.0]
  shaping:
    - "+0.60 correct issue detection (partial credit per issue)"
    - "+0.20 explanation quality"
    - "+0.10 severity accuracy"
    - "+0.10 correction quality (hard task only)"

endpoints:
  - path: /reset
    method: POST
    description: Start a new episode
  - path: /step
    method: POST
    description: Submit a review action
  - path: /state
    method: GET
    description: Get current environment state
  - path: /tasks
    method: GET
    description: List all tasks with grader info
  - path: /grader
    method: POST
    description: Grade an action without a full episode
  - path: /health
    method: GET
    description: Health check

runtime:
  framework: FastAPI + OpenEnv
  python: "3.11"
  docker: true
  hf_spaces: true